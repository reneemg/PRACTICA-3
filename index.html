<!DOCTYPE html>
<html lang="es">
<head>

  <title>Farmacias VitalMed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado / Barra Superior -->
  <header class="header">
    <div class="logo">
      <span class="icon">💊</span>
      <h1>Farmacias VitalMed</h1>
    </div>

    <!-- Botones secundarios/usuario -->
    <div class="user-actions">
      <a href="#carrito" class="btn btn-outline">🛒 Carrito</a>
      <a href="#login" class="btn btn-secondary">Iniciar Sesión</a>
    </div>
  </header>

  <!-- Sección Principal (Hero) -->
  <main class="hero-container">
    <div class="hero-content">
      <h2>Salud y bienestar</h2>
      <p>Servicios</p>

      <!-- Botones principales del servicio -->
      <div class="main-actions">
        <a href="#medicamentos" class="btn btn-primary btn-large">📦 Inventario</a>
        <a href="#sucursal" class="btn btn-primary btn-large">📍 Sucursal</a>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="footer">
    <p>&copy; 2026 Farmacias VitalMed</p>
  </footer>
